backend = "kmeans"
color_space = "lab"
threshold = 11
check_contrast = true

[templates]
waybar = { template = "waybar-colors.css", target = "~/.config/waybar/colors.css" }
swaync = { template = "swaync-colors.css", target = "~/.config/swaync/colors.css" }
kitty = { template = "kitty-colors.conf", target = "~/.config/kitty/colors.conf" }
hyprland = { template = "hyprland-colors.lua", target = "~/.config/hypr/colors.lua" }
rofi = { template = "rofi-colors.rasi", target = "~/.config/rofi/colors.rasi" }
wlogout = { template = "wlogout.css", target = "~/.config/wlogout/colors.css" }
yazi = { template = "yazi-theme.toml", target = "~/.config/yazi/theme.toml" }
nvchad = { template = "nvchad-wallust.lua", target = "~/.config/nvim/lua/themes/wallust.lua" }